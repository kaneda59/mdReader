name: Build Matrix

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            output_name: mdviewer.exe
          - os: ubuntu-latest
            output_name: mdviewer
          - os: macos-latest
            output_name: mdviewer.app

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-level: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install PyQt6 PyQt6-WebEngine pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed --name="mdviewer" app.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mdviewer-${{ matrix.os }}
        path: dist/